[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-gravity"
version = "0.1.0"
description = "Hybrid OpenAI Codex and Google Antigravity (Gemini 3.8 Flash) Autonomous Coding Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Codex Gravity Team" }
]
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codex-gravity = "codex_gravity.cli:main"
codex-gravity-mcp = "codex_gravity.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codex_gravity*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
