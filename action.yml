name: "Codex-Gravity review"
description: "Two independent AI agents review the pull-request diff and post one sticky comment"
author: "Codex-Gravity contributors"
branding:
  icon: "users"
  color: "orange"

inputs:
  base:
    description: "Git revision to diff against (e.g. origin/main). Empty reviews the working tree."
    required: false
    default: ""
  reviewers:
    description: "Comma-separated reviewers (antigravity, antigravity-pro, codex-cli, codex-gui)"
    required: false
    default: "antigravity,antigravity-pro"
  test-command:
    description: "Verification command run after the review (empty = skip)"
    required: false
    default: ""
  auto-test:
    description: "Fall back to python -m py_compile on changed Python files"
    required: false
    default: "true"
  fail-on-blockers:
    description: "Fail the step when the change is not approved"
    required: false
    default: "true"
  title:
    description: "Short title shown to the reviewers"
    required: false
    default: "Codex-Gravity review"
  max-diff:
    description: "Maximum diff characters per reviewer"
    required: false
    default: "60000"
  gemini-api-key:
    description: "Google Gemini API key (used when no local agentapi binary exists)"
    required: false
    default: ""
  github-token:
    description: "Token used to post the sticky comment"
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: "approved | changes_requested | failed | unavailable"
    value: ${{ steps.review.outputs.status }}
  session-id:
    description: "Team session id holding the transcript"
    value: ${{ steps.review.outputs.session_id }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Codex-Gravity
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Review the diff with two agents
      id: review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_REVIEWERS: ${{ inputs.reviewers }}
        INPUT_TEST: ${{ inputs.test-command }}
        INPUT_AUTO: ${{ inputs.auto-test }}
        INPUT_FAIL: ${{ inputs.fail-on-blockers }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_MAX: ${{ inputs.max-diff }}
      run: |
        set -uo pipefail
        out="${RUNNER_TEMP:-/tmp}/cg-review.json"
        # Untrusted inputs are bounded before they reach the CLI.
        title=$(printf '%s' "${INPUT_TITLE:-Codex-Gravity review}" | head -c 200)
        reviewers=$(printf '%s' "$INPUT_REVIEWERS" | head -c 200)
        args=(--workspace "$GITHUB_WORKSPACE" --ui plain --json
              --review-with "$reviewers" --title "$title" --max-diff "$INPUT_MAX")
        if [ -n "$INPUT_BASE" ]; then args+=(--base "$INPUT_BASE"); fi
        if [ -n "$INPUT_TEST" ]; then args+=(--test-cmd "$INPUT_TEST"); fi
        if [ "$INPUT_AUTO" = "true" ]; then args+=(--auto-test); fi

        codex-gravity-review "${args[@]}" > "$out"
        code=$?

        status=$(python -c "import json;print(json.load(open('$out')).get('status','unknown'))" 2>/dev/null || echo unknown)
        session=$(python -c "import json;print(json.load(open('$out')).get('session_id',''))" 2>/dev/null || echo '')
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "session_id=$session" >> "$GITHUB_OUTPUT"

        python "${{ github.action_path }}/scripts/action_comment.py" "$out" || true

        if [ "$status" = "unavailable" ]; then
          echo "::error::No reviewer was reachable (provide gemini-api-key or install a CLI transport)."
          exit 2
        fi
        if [ "$INPUT_FAIL" = "true" ]; then exit "$code"; fi
        exit 0
