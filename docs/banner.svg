<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Codex-Gravity: two agents, two-way review, consensus, verification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- title -->
  <text x="64" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="40" font-weight="700" fill="#f4f4f6">Codex · Gravity</text>
  <text x="64" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#90909a">two engineers, one transcript</text>

  <!-- left node: codex -->
  <g transform="translate(300 200)">
    <polygon points="0,-56 48,-28 48,28 0,56 -48,28 -48,-28" fill="#101014" stroke="#e4e4e7" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle r="6" fill="#e4e4e7"/>
    <text y="88" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#c8c8d0" letter-spacing="2">CODEX</text>
  </g>

  <!-- right node: antigravity -->
  <g transform="translate(900 200)">
    <polygon points="0,-56 48,-28 48,28 0,56 -48,28 -48,-28" fill="#151008" stroke="#f97316" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle r="6" fill="#f97316" filter="url(#glow)"/>
    <text y="88" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f97316" letter-spacing="2">ANTIGRAVITY</text>
  </g>

  <!-- two-way channel -->
  <g stroke-linecap="round" fill="none">
    <path d="M362 186 H838" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M380 172 H760" stroke="#e4e4e7" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M818 172 l-16 -7 v14 z" fill="#e4e4e7" stroke="none"/>
    <path d="M820 214 H440" stroke="#f97316" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M382 214 l16 -7 v14 z" fill="#f97316" stroke="none"/>
  </g>

  <!-- message tokens on the channel -->
  <g fill="#101014" stroke="#ffffff" stroke-opacity="0.14">
    <rect x="470" y="158" width="44" height="28" rx="6"/>
    <rect x="530" y="158" width="44" height="28" rx="6"/>
    <rect x="590" y="158" width="44" height="28" rx="6"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#90909a">
    <text x="492" y="176" text-anchor="middle">Q</text>
    <text x="552" y="176" text-anchor="middle">A</text>
    <text x="612" y="176" text-anchor="middle">REV</text>
  </g>

  <!-- consensus chip -->
  <g transform="translate(600 232)">
    <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#101014" stroke="#f97316" stroke-opacity="0.35"/>
    <text y="5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#f97316" letter-spacing="1">CONSENSUS · VERIFIED</text>
  </g>

  <!-- pipeline labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5e5e68" letter-spacing="1">
    <text x="600" y="60" text-anchor="middle">PLAN → REVIEW → CROSS-EXAMINE → REVISE → TALLY → VERIFY</text>
  </g>
</svg>
